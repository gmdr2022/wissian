name: Wissian CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wissian-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Documentos e escopo
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validar contratos e integridade das fontes
        run: python3 -B docs/mestre/ferramentas/validar_pacote.py --root . --workspace --json
      - name: Identificar a aplicacao nesta ref
        id: scope
        shell: bash
        run: |
          if [[ -f global.json || -f Wissian.slnx || -d src ]]; then
            test -f global.json
            test -f Wissian.slnx
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
          else
            echo 'runtime=false' >> "$GITHUB_OUTPUT"
            echo 'Ref documental: testes de produto NOT_RUN (aplicacao ainda ausente).' >> "$GITHUB_STEP_SUMMARY"
          fi

  foundation:
    name: Fundacao, identidade e isolamento
    needs: contracts
    if: needs.contracts.outputs.runtime == 'true'
    # DPAPI, ACLs e o laboratorio PostgreSQL atual sao contratos Windows.
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_PACKAGES: ${{ github.workspace }}/.local/nuget-packages
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restaurar dependencias fixadas
        run: dotnet restore Wissian.slnx --locked-mode --disable-parallel
      - name: Compilar com avisos tratados como erros
        run: dotnet build Wissian.slnx --no-restore --disable-build-servers -m:1 -p:BuildInParallel=false -p:UseSharedCompilation=false
      - name: Executar a suite do Core e composicao
        run: dotnet run --project tests/Wissian.Foundation.Tests --no-build --no-restore
      - name: Restaurar ferramenta de migrations
        run: dotnet tool restore
      - name: Verificar divergencia entre modelo e migrations
        run: dotnet ef migrations has-pending-model-changes --project src/Wissian.Persistence --no-build
      - name: Preparar PostgreSQL 18.6 isolado e verificado
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'postgresql-18.6-4.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'wissian-postgres'
          Invoke-WebRequest -Uri 'https://get.enterprisedb.com/postgresql/postgresql-18.6-4-windows-x64-binaries.zip' -OutFile $archive
          $expected = '1df55002afe95b945d934c078b13e82c1603fa546731e511d068aa983b4ead28'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'SHA-256 inesperado: os binarios PostgreSQL nao serao executados.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          "WISSIAN_CI_POSTGRES_BIN=$destination/pgsql/bin" >> $env:GITHUB_ENV
      - name: Executar persistencia e RLS em banco sintetico
        run: ./scripts/Test-Postgres.ps1 -PostgresBin $env:WISSIAN_CI_POSTGRES_BIN -Suite Persistence
      - name: Executar API, identidade e concorrencia em HTTPS
        run: ./scripts/Test-Postgres.ps1 -PostgresBin $env:WISSIAN_CI_POSTGRES_BIN -Suite Api
